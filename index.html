<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<meta property="og:description" content="社群連結、活動報名與 115 學年行事曆。">

<style>
  :root{
    --orange:#F2A72C;
    --orange-dark:#D98C12;
    --green:#A9CE3B;
    --green-dark:#82A821;
    --ink:#333333;
    --ink-soft:#6b6b66;
    --cream:#FFFCF2;
    --card:#ffffff;
    --line:#EDE6D4;
  }

  *,*::before,*::after{box-sizing:border-box;}

  html{scroll-behavior:smooth;}

  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }

  /* 背景以社徽的橘綠雙色做柔和光暈 */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    background:
      radial-gradient(52rem 32rem at 12% -8%, rgba(242,167,44,.20), transparent 62%),
      radial-gradient(46rem 30rem at 92% 6%, rgba(169,206,59,.22), transparent 62%),
      radial-gradient(40rem 28rem at 50% 108%, rgba(242,167,44,.12), transparent 65%);
  }

  .wrap{
    width:100%;
    max-width:52rem;
    margin:0 auto;
    padding:3rem 1.25rem 4rem;
  }

  /* ---------- 頁首 ---------- */
  .hero{text-align:center;}

  .hero__mark{
    width:min(15rem,58vw);
    height:auto;
    display:block;
    margin:0 auto .5rem;
    filter:drop-shadow(0 .5rem 1.25rem rgba(51,51,51,.10));
  }

  .hero__sub{
    display:inline-block;
    margin:0 0 .75rem;
    padding:.3rem 1rem;
    border-radius:999px;
    background:var(--card);
    border:2px solid var(--line);
    font-size:.9rem;
    font-weight:700;
    letter-spacing:.08em;
    color:var(--ink-soft);
  }

  .hero__title{
    margin:.25rem 0 .5rem;
    font-size:clamp(1.9rem,6.2vw,2.9rem);
    font-weight:900;
    letter-spacing:.02em;
  }

  .hero__title em{
    font-style:normal;
    background:linear-gradient(180deg,transparent 62%,rgba(169,206,59,.55) 62%);
  }

  .hero__lede{
    margin:0 auto;
    max-width:34rem;
    color:var(--ink-soft);
    font-size:1.02rem;
  }

  .hero__stamp{
    width:min(11rem,42vw);
    height:auto;
    display:block;
    margin:1.5rem auto 0;
    transform:rotate(-3deg);
  }

  /* ---------- 區塊標題 ---------- */
  .section{margin-top:3.25rem;}

  .section__head{
    display:flex;
    align-items:center;
    gap:.75rem;
    margin-bottom:1.25rem;
  }

  .section__head h2{
    margin:0;
    font-size:1.3rem;
    font-weight:900;
    white-space:nowrap;
  }

  .section__head::after{
    content:"";
    flex:1;
    height:3px;
    border-radius:999px;
    background:linear-gradient(90deg,var(--orange),var(--green),transparent);
  }

  .section__dot{
    width:.9rem;
    height:.9rem;
    border-radius:50%;
    background:var(--orange);
    box-shadow:0 0 0 .28rem rgba(242,167,44,.22);
    flex:none;
  }

  /* ---------- 連結卡片 ---------- */
  .links{
    display:grid;
    gap:1rem;
    grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));
    list-style:none;
    margin:0;
    padding:0;
  }

  .link{
    position:relative;
    display:flex;
    align-items:center;
    gap:1rem;
    padding:1.15rem 1.25rem;
    background:var(--card);
    border:2px solid var(--line);
    border-radius:1.25rem;
    text-decoration:none;
    color:inherit;
    box-shadow:0 .35rem 0 rgba(51,51,51,.06);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }

  .link:hover,
  .link:focus-visible{
    transform:translateY(-.3rem);
    border-color:var(--brand,var(--orange));
    box-shadow:0 .8rem 1.4rem rgba(51,51,51,.12);
  }

  .link:focus-visible{outline:3px solid var(--ink);outline-offset:3px;}

  .link__icon{
    flex:none;
    width:3rem;
    height:3rem;
    display:grid;
    place-items:center;
    border-radius:1rem;
    background:var(--brand,var(--orange));
    color:#fff;
  }

  .link__icon svg{width:1.6rem;height:1.6rem;fill:currentColor;}

  .link__text{min-width:0;}

  .link__name{
    display:block;
    font-weight:800;
    font-size:1.05rem;
  }

  .link__note{
    display:block;
    font-size:.85rem;
    color:var(--ink-soft);
  }

  .link__arrow{
    margin-left:auto;
    flex:none;
    font-size:1.2rem;
    color:var(--ink-soft);
    transition:transform .18s ease;
  }

  .link:hover .link__arrow{transform:translateX(.25rem);}

  /* ---------- 活動報名卡 ---------- */
  .events{
    display:grid;
    gap:1.25rem;
    grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));
    list-style:none;
    margin:0;
    padding:0;
  }

  .event{
    display:flex;
    flex-direction:column;
    height:100%;
    background:var(--card);
    border:2px solid var(--line);
    border-radius:1.25rem;
    overflow:hidden;
    text-decoration:none;
    color:inherit;
    box-shadow:0 .35rem 0 rgba(51,51,51,.06);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }

  .event:hover,
  .event:focus-visible{
    transform:translateY(-.35rem);
    border-color:var(--orange);
    box-shadow:0 .9rem 1.5rem rgba(51,51,51,.14);
  }

  .event:focus-visible{outline:3px solid var(--ink);outline-offset:3px;}

  .event__figure{
    position:relative;
    margin:0;
    background:#f4f0e4;
  }

  .event__img{
    display:block;
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    transition:transform .3s ease;
  }

  .event:hover .event__img{transform:scale(1.04);}

  .event__date{
    position:absolute;
    top:.75rem;
    left:.75rem;
    padding:.25rem .7rem;
    border-radius:999px;
    background:rgba(51,51,51,.88);
    color:#fff;
    font-size:.8rem;
    font-weight:800;
    letter-spacing:.03em;
    backdrop-filter:blur(2px);
  }

  .event__body{
    display:flex;
    flex-direction:column;
    gap:.85rem;
    flex:1;
    padding:1.1rem 1.15rem 1.25rem;
  }

  .event__name{
    margin:0;
    font-size:1.08rem;
    font-weight:900;
    line-height:1.45;
  }

  .event__cta{
    margin-top:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:.45rem;
    padding:.65rem 1rem;
    border-radius:999px;
    background:linear-gradient(135deg,var(--orange),var(--orange-dark));
    color:#fff;
    font-weight:900;
    font-size:1rem;
    letter-spacing:.04em;
    box-shadow:0 .25rem .6rem rgba(217,140,18,.35);
  }

  .event:hover .event__cta{
    background:linear-gradient(135deg,var(--green),var(--green-dark));
    box-shadow:0 .25rem .6rem rgba(130,168,33,.4);
  }

  .event__cta svg{
    width:1.15rem;
    height:1.15rem;
    fill:currentColor;
    animation:tap 1.8s ease-in-out infinite;
  }

  @keyframes tap{
    0%,70%,100%{transform:translate(0,0);}
    80%{transform:translate(-.12rem,-.22rem);}
    90%{transform:translate(0,.05rem);}
  }

  /* 未開放的報名表單 */
  .link--soon{
    cursor:default;
    background:repeating-linear-gradient(-45deg,#fff,#fff 10px,#fdf8ea 10px,#fdf8ea 20px);
    box-shadow:none;
    border-style:dashed;
  }

  .link--soon:hover{transform:none;box-shadow:none;border-color:var(--line);}

  .link--soon .link__icon{background:#cfcabb;}

  .badge{
    margin-left:auto;
    flex:none;
    padding:.2rem .6rem;
    border-radius:999px;
    background:var(--ink);
    color:#fff;
    font-size:.72rem;
    font-weight:700;
    letter-spacing:.05em;
  }

  /* ---------- 行事曆 ---------- */
  .calendar{
    background:var(--card);
    border:2px solid var(--line);
    border-radius:1.5rem;
    padding:1rem;
    box-shadow:0 .35rem 0 rgba(51,51,51,.06);
  }

  .calendar img{
    display:block;
    width:100%;
    height:auto;
    border-radius:1rem;
    cursor:zoom-in;
  }

  /* ---------- 行事曆放大檢視 ---------- */
  .lightbox{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:1rem;
    overflow:auto;
    overscroll-behavior:contain;
    background:rgba(38,36,30,.9);
    cursor:zoom-out;
    animation:fade .18s ease;
  }

  .lightbox[hidden]{display:none;}

  .lightbox img{
    display:block;
    width:auto;
    max-width:100%;
    margin:auto;
    border-radius:.75rem;
    box-shadow:0 1.5rem 3rem rgba(0,0,0,.45);
  }

  .lightbox__close{
    position:fixed;
    top:1rem;
    right:1rem;
    width:2.75rem;
    height:2.75rem;
    display:grid;
    place-items:center;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,.92);
    color:var(--ink);
    font-size:1.5rem;
    line-height:1;
    cursor:pointer;
  }

  .lightbox__close:focus-visible{outline:3px solid #fff;outline-offset:3px;}

  @keyframes fade{from{opacity:0;}to{opacity:1;}}

  .calendar__caption{
    margin:.9rem .25rem .25rem;
    text-align:center;
    font-size:.88rem;
    color:var(--ink-soft);
  }

  /* ---------- 頁尾 ---------- */
  .foot{
    margin-top:3.5rem;
    padding-top:1.5rem;
    border-top:2px dashed var(--line);
    text-align:center;
    font-size:.85rem;
    color:var(--ink-soft);
  }

  .foot img{
    width:4.5rem;
    height:auto;
    display:block;
    margin:0 auto .5rem;
    opacity:.85;
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important;scroll-behavior:auto!important;}
  }
</style>
</head>

    <p>台科大崇德志工社 NTUST CDVC</p>
  </footer>

</main>

<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox__close" id="lightbox-close" type="button" aria-label="關閉">&times;</button>
  <img id="lightbox-img" src="" alt="">
</div>

<script>
(function () {
  "use strict";

  var thumb = document.getElementById("calendar-img");
  var box   = document.getElementById("lightbox");
  var full  = document.getElementById("lightbox-img");
  var close = document.getElementById("lightbox-close");
  if (!thumb || !box || !full) return;

  function open() {
    full.src = thumb.currentSrc || thumb.src;
    full.alt = thumb.alt;
    box.hidden = false;
    document.body.style.overflow = "hidden";
    close.focus();
  }

  function shut() {
    box.hidden = true;
    document.body.style.overflow = "";
    thumb.focus();
  }

  thumb.addEventListener("click", open);

  thumb.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
  });

  // 點背景或關閉鈕都收起來；點圖片本身不關，方便放大後拖曳閱讀
  box.addEventListener("click", function (e) {
    if (e.target !== full) shut();
  });

  document.addEventListener("keydown", function (e) {
    if (!box.hidden && (e.key === "Escape" || e.key === "Esc")) shut();
  });
})();
</script>
</body>
</html>
